name: Infrastructure check
on:
  push:
    branches: [infra-check]
    paths: ['.github/workflows/check.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: infrastructure-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect bootstrap and verify private storage
        shell: python
        run: |
          import json, os, re, urllib.request, urllib.error, sys, hashlib, subprocess, tempfile, uuid, pathlib, email
          from email import policy
          token = os.environ.get("CF_TOKEN", "")
          account = os.environ.get("CF_ACCOUNT", "")
          if not token or not re.fullmatch(r"[0-9a-fA-F]{32}", account):
              sys.exit("Credentials: missing or invalid format")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          base = "https://api.cloudflare.com/client/v4/accounts/" + account
          script = base + "/workers/scripts/updatereportexcel"
          host = "https://updatereportexcel.supra.cc.cd"
          def request(url, auth=False, agent=None):
              headers = {"Authorization": "Bearer " + token} if auth else {}
              if agent:
                  headers["User-Agent"] = agent
              try:
                  with opener.open(urllib.request.Request(url, headers=headers), timeout=15) as res:
                      return res.status, res.headers, res.read(1048576)
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read(1048576)
              except Exception:
                  return 0, {}, b""
          def parse(body):
              try: return json.loads(body)
              except Exception: return {}
          def api(label, url):
              status, headers, body = request(url, True)
              data = parse(body)
              ok = status == 200 and data.get("success") is True
              codes = [str(v["code"]) for v in (data.get("errors") or []) if isinstance(v, dict) and isinstance(v.get("code"), int)]
              print(label + ": " + str(status) + (" PASS" if ok else " FAIL") + (" codes=" + ",".join(codes) if codes else ""))
              return data.get("result") if ok else None
          verified = api("Account token", base + "/tokens/verify")
          if not isinstance(verified, dict) or verified.get("status") != "active":
              sys.exit("Token inactive")
          settings = api("Worker version settings", script + "/settings")
          domains = api("Domain mapping", base + "/workers/domains?hostname=updatereportexcel.supra.cc.cd")
          mapped = isinstance(domains, list) and any(v.get("hostname") == "updatereportexcel.supra.cc.cd" and v.get("service") == "updatereportexcel" and v.get("enabled", True) for v in domains)
          print("Exact domain mapping: " + ("PASS" if mapped else "FAIL"))
          bindings = (settings.get("bindings") or []) if isinstance(settings, dict) else []
          binding_ok = len(bindings) == 1 and any(b.get("name") == "RELEASES" and b.get("type") == "r2_bucket" and b.get("bucket_name") == "supra-reportexcel-releases" for b in bindings)
          print("Exact R2 binding: " + ("PASS" if binding_ok else "FAIL"))
          deployment = api("Deployment history", script + "/deployments")
          if isinstance(deployment, dict):
              ds = (deployment.get("deployments") or [])
              print("Deployment exists: " + ("YES" if ds else "NO"))
              if ds:
                  print("Latest deployment versions: " + str(len((ds[0].get("versions") or []))))
          source_url = "https://raw.githubusercontent.com/tamnv2/supra-reportexcel/3f386afc1a2b780da54e7779b5b81c275558cee1/src/worker.mjs"
          ss, _, expected = request(source_url)
          status, headers, body = request(script + "/content/v2", True)
          same = False
          if status == 200 and ss == 200:
              if body == expected:
                  same = True
              elif "multipart/" in headers.get("Content-Type", ""):
                  msg = email.message_from_bytes(("Content-Type: " + headers["Content-Type"] + "\r\n\r\n").encode() + body, policy=policy.default)
                  same = any(part.get_payload(decode=True) == expected for part in msg.iter_parts())
          print("Pinned source download: HTTP " + str(ss))
          print("Worker content: HTTP " + str(status) + "; matches pinned bootstrap: " + ("YES" if same else "NOT VERIFIED"))
          env = dict(os.environ, AWS_ACCESS_KEY_ID=verified["id"], AWS_SECRET_ACCESS_KEY=hashlib.sha256(token.encode()).hexdigest(), AWS_DEFAULT_REGION="auto", AWS_PAGER="", AWS_EC2_METADATA_DISABLED="true", AWS_MAX_ATTEMPTS="1")
          def s3(operation, *args):
              try:
                  res = subprocess.run(["aws", "s3api", operation, "--bucket", "supra-reportexcel-releases", "--endpoint-url", "https://" + account + ".r2.cloudflarestorage.com", "--cli-connect-timeout", "10", "--cli-read-timeout", "10", *args], env=env, capture_output=True, timeout=25)
                  return res.returncode == 0, res.stdout
              except Exception:
                  return False, b""
          listed, raw = s3("list-objects-v2", "--prefix", "manifest.json", "--max-keys", "1", "--no-paginate")
          absent = listed and not any(v.get("Key") == "manifest.json" for v in (parse(raw).get("Contents") or []))
          print("R2 read: " + ("PASS" if listed else "FAIL"))
          print("No active manifest: " + ("PASS" if absent else "FAIL"))
          key = "_diagnostics/" + uuid.uuid4().hex + ".txt"
          written = readback = deleted = False
          with tempfile.TemporaryDirectory() as tmp:
              src = pathlib.Path(tmp) / "probe"
              dst = pathlib.Path(tmp) / "readback"
              src.write_bytes(b"bootstrap storage probe\n")
              if listed:
                  try:
                      written, _ = s3("put-object", "--key", key, "--body", str(src), "--if-none-match", "*")
                      if written:
                          got, _ = s3("get-object", "--key", key, str(dst))
                          readback = got and dst.read_bytes() == src.read_bytes()
                  finally:
                      deleted, _ = s3("delete-object", "--key", key)
                      if deleted:
                          ok, raw = s3("list-objects-v2", "--prefix", key, "--max-keys", "1", "--no-paginate")
                          deleted = ok and not parse(raw).get("Contents")
          for label, ok in [("R2 write", written), ("R2 readback", readback), ("R2 cleanup", deleted)]:
              print(label + ": " + ("PASS" if ok else "FAIL"))
          def probe(path, agent=None):
              status, headers, body = request(host + path, agent=agent)
              data = parse(body)
              ok = (status == 200 and data.get("status") == "ok" and data.get("storage") == "ready" and data.get("updates_enabled") is False) if path == "/health" else (status == 404 and data.get("error") == "NO_RELEASE")
              low = body.lower()
              flags = []
              for tag, hit in [("challenge", headers.get("cf-mitigated") == "challenge"), ("access", "cloudflareaccess.com" in headers.get("Location", "") or b"cloudflare access" in low), ("cloudflare-page", b"cloudflare" in low), ("error-1010", bool(re.search(rb"(?:error\s*(?:code\s*)?[:#]?\s*1010|>\s*1010\s*<)", low))), ("error-1020", b"1020" in low), ("blocked", b"blocked" in low), ("json", bool(data)), ("ray-present", bool(headers.get("cf-ray")))]:
                  if hit: flags.append(tag)
              print("Endpoint " + path + ": " + str(status) + (" PASS" if ok else " FAIL") + " [" + ",".join(flags) + "]")
              return ok
          print("Default HTTP client:")
          probe("/health")
          print("Identified update client:")
          health = probe("/health", "SupraReportExcel-Updater/1.0")
          manifest = probe("/manifest.json", "SupraReportExcel-Updater/1.0")
          if not all([mapped, binding_ok, listed, absent, written, readback, deleted, health, manifest]):
              sys.exit("Bootstrap deployment preflight failed")
          if same:
              print("Bootstrap already matches; deployment not needed")
              sys.exit(0)
          if os.environ.get("GITHUB_EVENT_NAME") != "push" or os.environ.get("GITHUB_REF") != "refs/heads/infra-check" or parse(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes()).get("head_commit", {}).get("message") != "ci: deploy approved bootstrap with rollback":
              sys.exit("Read-only check: source differs; no deployment attempted")
          if ss != 200 or hashlib.sha1(b"blob " + str(len(expected)).encode() + b"\x00" + expected).hexdigest() != "db7a747fd61a638e07b04a5ef9635ae0e2ea1e93":
              sys.exit("Pinned source integrity failed")
          test_status, _, tests = request(source_url.replace("src/worker.mjs", "test/worker.test.mjs"))
          if test_status != 200 or hashlib.sha1(b"blob " + str(len(tests)).encode() + b"\x00" + tests).hexdigest() != "5ee74df8848bbb0c2cb5e655f9da9f766ee05634":
              sys.exit("Pinned tests integrity failed")
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              (root / "src").mkdir()
              (root / "test").mkdir()
              (root / "src/worker.mjs").write_bytes(expected)
              (root / "test/worker.test.mjs").write_bytes(tests)
              result = subprocess.run(["node", "--test", str(root / "test/worker.test.mjs")], cwd=tmp, capture_output=True, timeout=20)
              print("Bootstrap unit tests: " + ("PASS" if result.returncode == 0 else "FAIL"))
              if result.returncode:
                  sys.exit(1)
          ds = deployment.get("deployments") or [] if isinstance(deployment, dict) else []
          old = ds[0].get("versions") or [] if ds else []
          if len(old) != 1 or old[0].get("percentage") != 100 or not re.fullmatch(r"[0-9a-fA-F-]{36}", str(old[0].get("version_id", ""))):
              sys.exit("Cannot establish rollback version")
          old_id = old[0]["version_id"]
          def post(label, url, data, content_type):
              try:
                  req = urllib.request.Request(url, data=data, headers={"Authorization": "Bearer " + token, "Content-Type": content_type}, method="POST")
                  with opener.open(req, timeout=25) as res:
                      status, payload = res.status, parse(res.read(1048576))
              except urllib.error.HTTPError as exc:
                  status, payload = exc.code, parse(exc.read(1048576))
              except Exception:
                  status, payload = 0, {}
              ok = 200 <= status < 300 and payload.get("success") is True
              codes = [str(v["code"]) for v in (payload.get("errors") or []) if isinstance(v, dict) and isinstance(v.get("code"), int)]
              print(label + ": " + str(status) + (" PASS" if ok else " FAIL") + (" codes=" + ",".join(codes) if codes else ""))
              return payload.get("result") if ok else None
          marker = "bootstrap-db7a747fd61a638e07b04a5ef9635ae0e2ea1e93"
          previous = api("Active version details", script + "/versions/" + old_id)
          if not isinstance(previous, dict):
              sys.exit("Cannot verify rollback version")
          # Never replace a deployment that includes unexpected bindings.
          prior_bindings = (previous.get("resources") or {}).get("bindings")
          if not isinstance(prior_bindings, list) or len(prior_bindings) != 1 or not any(b.get("name") == "RELEASES" and b.get("type") == "r2_bucket" and b.get("bucket_name") == "supra-reportexcel-releases" for b in prior_bindings):
              sys.exit("Active version bindings not verified")
          # A tagged, verified version needs no repeat upload.
          annotation = previous.get("annotations") or {}
          if annotation.get("workers/tag") == marker:
              print("Pinned bootstrap version already active")
              sys.exit(0)
          meta = {"main_module": "worker.mjs", "compatibility_date": "2026-11-25", "bindings": [{"name":"RELEASES","type":"r2_bucket","bucket_name":"supra-reportexcel-releases"}], "annotations":{"workers/tag":marker}}
          boundary = "bootstrap-" + uuid.uuid4().hex
          sep = ("--" + boundary + "\r\n").encode()
          def part(name, typ, data, filename=None):
              disposition = 'Content-Disposition: form-data; name="' + name + '"' + ('; filename="' + filename + '"' if filename else '')
              return sep + (disposition + "\r\nContent-Type: " + typ + "\r\n\r\n").encode() + data + b"\r\n"
          data = part("metadata","application/json",json.dumps(meta).encode()) + part("worker.mjs","application/javascript+module",expected,"worker.mjs") + ("--" + boundary + "--\r\n").encode()
          uploaded = post("Upload pinned bootstrap version", script + "/versions", data, "multipart/form-data; boundary=" + boundary)
          new_id = uploaded.get("id", "") if isinstance(uploaded, dict) else ""
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", new_id):
              sys.exit("Upload not confirmed; no activation attempted")
          # Ensure the currently deployed version has not changed in the meantime.
          latest = api("Pre-activation deployment check", script + "/deployments")
          latest_ds = latest.get("deployments") or [] if isinstance(latest, dict) else []
          if not latest_ds or latest_ds[0].get("id") != ds[0].get("id"):
              sys.exit("Deployment changed concurrently; no activation attempted")
          def activate(label, version):
              return post(label, script + "/deployments", json.dumps({"strategy":"percentage","versions":[{"version_id":version,"percentage":100}]}).encode(), "application/json")
          def current_version():
              result = api("Active deployment verification", script + "/deployments")
              items = result.get("deployments") or [] if isinstance(result, dict) else []
              versions = items[0].get("versions") or [] if items else []
              return versions[0].get("version_id") if len(versions) == 1 and versions[0].get("percentage") == 100 else None
          try:
              deployed = activate("Activate bootstrap", new_id)
              if not deployed or current_version() != new_id:
                  raise RuntimeError("Activation not verified")
              import time
              time.sleep(4)
              if not probe("/health", "SupraReportExcel-Updater/1.0") or not probe("/manifest.json", "SupraReportExcel-Updater/1.0"):
                  raise RuntimeError("Smoke test failed")
              print("Bootstrap deployment and smoke test: PASS")
          except Exception:
              if current_version() == new_id:
                  rolled = activate("Rollback bootstrap", old_id)
                  print("Rollback verified: " + ("PASS" if rolled and current_version() == old_id else "FAIL"))
              else:
                  print("Rollback not attempted: new version not confirmed active")
              sys.exit(1)
