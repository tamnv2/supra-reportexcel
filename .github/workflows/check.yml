name: Infrastructure check
on:
  push:
    branches: [infra-check]
    paths: ['.github/workflows/check.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify access
        shell: python
        run: |
          import json, os, re, urllib.request, urllib.error, sys, hashlib, subprocess
          token = os.environ.get("CF_TOKEN", "")
          account = os.environ.get("CF_ACCOUNT", "")
          if not token or not re.fullmatch(r"[0-9a-fA-F]{32}", account):
              print("Credentials: missing or invalid format")
              sys.exit(1)
          print("Credentials: present")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def check(label, url, predicate, auth=False):
              headers = {"Authorization": "Bearer " + token} if auth else {}
              try:
                  with opener.open(urllib.request.Request(url, headers=headers), timeout=15) as res:
                      status = res.status
                      data = json.load(res)
              except urllib.error.HTTPError as e:
                  status = e.code
                  if not auth and status == 404:
                      try:
                          data = json.load(e)
                      except Exception:
                          data = {}
                  else:
                      try:
                          payload = json.load(e)
                          codes = [v.get("code") for v in payload.get("errors", []) if isinstance(v, dict) and isinstance(v.get("code"), int)]
                      except Exception:
                          codes = []
                      print(label + ": error codes " + ",".join(map(str, codes)))
                      if e.headers.get("cf-mitigated") == "challenge":
                          print(label + ": challenge")
                      data = {}
              except Exception:
                  print(label + ": connection failed")
                  return False
              ok = predicate(status, data)
              print(label + ": " + str(status) + (" PASS" if ok else " FAIL"))
              return ok
          base = "https://api.cloudflare.com/client/v4/accounts/" + account
          host = "https://updatereportexcel.supra.cc.cd"
          api_ok = lambda status, data: status == 200 and data.get("success") is True
          verified = {}
          def token_ok(status, data):
              if status == 200 and data.get("result", {}).get("status") == "active":
                  verified.update(data["result"])
                  return True
              return False
          active = check("Account token", base + "/tokens/verify", token_ok, True)
          worker = check("Worker", base + "/workers/scripts/updatereportexcel/script-settings", api_ok, True)
          if not worker:
              check("Worker alias", base + "/workers/scripts/suprareportexcel/script-settings", api_ok, True)
          storage = False
          if active and verified.get("id"):
              env = dict(os.environ, AWS_ACCESS_KEY_ID=verified["id"], AWS_SECRET_ACCESS_KEY=hashlib.sha256(token.encode()).hexdigest(), AWS_DEFAULT_REGION="auto", AWS_PAGER="", AWS_EC2_METADATA_DISABLED="true", AWS_MAX_ATTEMPTS="1")
              try:
                  res = subprocess.run(["aws", "s3api", "list-objects-v2", "--bucket", "supra-reportexcel-releases", "--max-keys", "1", "--no-paginate", "--endpoint-url", "https://" + account + ".r2.cloudflarestorage.com", "--cli-connect-timeout", "15", "--cli-read-timeout", "15"], env=env, capture_output=True, timeout=40)
                  storage = res.returncode == 0
              except Exception:
                  storage = False
          print("Storage S3: " + ("PASS" if storage else "FAIL"))
          def domain_ok(status, data):
              if not api_ok(status, data):
                  return False
              return any(v.get("hostname") == "updatereportexcel.supra.cc.cd" and v.get("service") == "updatereportexcel" and v.get("enabled", True) for v in data.get("result", []))
          check("Domain mapping", base + "/workers/domains?hostname=updatereportexcel.supra.cc.cd", domain_ok, True)
          results = [
              worker, storage,
              check("Health", host + "/health", lambda s,d: s == 200 and d.get("status") == "ok" and d.get("storage") == "ready" and d.get("updates_enabled") is False),
              check("Manifest", host + "/manifest.json", lambda s,d: s == 404 and d.get("error") == "NO_RELEASE"),
          ]
          sys.exit(0 if all(results) else 1)
